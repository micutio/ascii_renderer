# Builds native CLI archives and publishes them to a GitHub Release.
# Pub.dev publishing, code signing, and extra CPU architectures are out of scope.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, including the leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Check tag, pubspec version, and changelog
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' must look like v1.2.3."
            exit 1
          fi
          version="${tag#v}"
          pubspec_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml | tr -d '\r')"
          if [ "$pubspec_version" != "$version" ]; then
            echo "::error::Tag $tag does not match pubspec version '$pubspec_version'."
            exit 1
          fi
          if ! grep -q "^## ${version}[[:space:]]*$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no heading '## ${version}'."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: verify
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/Pub/Cache' || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: dart pub get

      - name: Run tests
        run: dart test

  build:
    name: Build
    needs: [verify, test]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_x64
            archive_os: linux-x64
          - os: macos-latest
            target: macos_arm64
            archive_os: macos-arm64
          - os: windows-latest
            target: windows_x64
            archive_os: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/Pub/Cache' || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: dart pub get

      - name: Build CLI bundle
        run: dart build cli

      - name: Smoke test CLI bundle
        run: dart run tool/smoke_cli.dart

      - name: Package tar.gz
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/ascii_renderer-${{ needs.verify.outputs.version }}-${{ matrix.archive_os }}.tar.gz"
          tar -czf "$archive" -C "build/cli/${{ matrix.target }}/bundle" .

      - name: Package zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "dist/ascii_renderer-${{ needs.verify.outputs.version }}-${{ matrix.archive_os }}.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/cli/${{ matrix.target }}/bundle/*" -DestinationPath $dest

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.archive_os }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Read release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          notes="$(awk -v ver="$VERSION" '
            $0 ~ "^## " ver "[[:space:]]*$" { capture = 1; next }
            capture && /^## / { exit }
            capture { sub(/\r$/, ""); print }
          ' CHANGELOG.md)"
          {
            echo "body<<RELEASE_NOTES_END"
            printf '%s\n' "$notes"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      # The first publishes stay drafts so the archives can be checked
      # before the release is public. Set draft to false once that is trusted.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ${{ needs.verify.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
